<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rounding Off to Nearest 10</title>
  <link href="./style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createApp, reactive, ref, computed } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

    const App = {
      setup() {
        const questions = reactive([
          { id: 1, value: 17, choices: [10, 20, 17], answer: 20 },
          { id: 2, value: 75, choices: [70, 80, 175], answer: 80 },
          { id: 3, value: 64, choices: [64, 70, 60], answer: 60 },
          { id: 4, value: 98, choices: [80, 100, 89], answer: 100 },
          { id: 5, value: 94, choices: [100, 94, 90], answer: 90 },
          { id: 6, value: 445, choices: [450, 440, 500], answer: 450 },
          { id: 7, value: 45, choices: [50, 45, 40], answer: 50 },
          { id: 8, value: 19, choices: [20, 10, 19], answer: 20 },
          { id: 9, value: 0, choices: [10, 1, 0], answer: 0 },
          { id: 10, value: 199, choices: [190, 100, 200], answer: 200 },
          { id: 11, value: 165, choices: [160, 170, 150], answer: 170 },
          { id: 12, value: 999, choices: [990, 1000, 909], answer: 1000 },
        ])

        const answers = reactive({})
        questions.forEach(q => answers[q.id] = null)

        const name = ref('')
        const submitted = ref(false)
        const score = ref(null)
        const highestScore = ref(null)

        const nameDisplay = computed(() => name.value || '')

        function resetAnswers() {
          questions.forEach(q => answers[q.id] = null)
          submitted.value = false
          score.value = null
        }

        function submit() {
          if (!name.value || name.value.trim().length === 0) {
            alert('Please enter your name before submitting.')
            return
          }
          let s = 0
          questions.forEach(q => {
            if (String(answers[q.id]) === String(q.answer)) s += 1
          })
          score.value = s
          submitted.value = true
          submitScore()
        }

        function submitScore() {
          const link = 'https://score-api-1.onrender.com/api/scores'
          fetch(link, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.value, score: score.value }),
          })
          .then(res => res.json())
          .then(data => {
            console.log('Saved score:', data)
            getHighestScore()
          })
          .catch(err => {
            console.error(err)
            alert('Error submitting score')
          })
        }

        function getHighestScore() {
          fetch('https://score-api-1.onrender.com/api/scores/highest')
            .then(res => res.json())
            .then(data => { highestScore.value = data })
        }

        return { questions, answers, name, submitted, score, highestScore, nameDisplay, resetAnswers, submit }
      },
      template: `
      <div class="container">
        <header class="header"><h2 class="title-border">Rounding Off to Nearest 10</h2></header>
        <main class="main">
          <div class="card form-card">
            <label class="field">
              <span>Name</span>
              <input v-model="name" placeholder="Enter your name" />
            </label>

            <div class="questions">
              <div v-for="(q, idx) in questions" :key="q.id" class="question">
                <div class="qtop"><strong>Q{{ idx + 1 }}.</strong> <span class="qtext">Round {{ q.value }} to the nearest 10</span></div>
                <div class="choices">
                  <label v-for="(choice, cidx) in q.choices" :key="cidx" class="choice">
                    <input type="radio" :name="'q'+q.id" :value="choice" v-model="answers[q.id]" />
                    <span>{{ choice }}</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="buttons">
              <button class="btn reset" @click="resetAnswers" type="button">Reset</button>
              <button class="btn submit" @click="submit" type="button">Submit</button>
            </div>

            <div class="result" v-if="submitted">
              <p v-if="score !== null">{{ nameDisplay }}, your score: <strong class="score">{{ score }}/{{ questions.length }}</strong></p>
              <p v-if="highestScore">🏆 Highest score: {{ highestScore.score }}</p>
            </div>
          </div>
        </main>
        <footer class="footer"><small>Copyright: www.mathinenglish.com</small></footer>
      </div>
      `
    }

    createApp(App).mount('#app')
  </script>
</body>
</html>
